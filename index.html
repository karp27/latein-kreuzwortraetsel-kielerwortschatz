<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kieler Wortschatz · Kreuzworträtsel</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --border: #e0e0e5;
  --tx: #1d1d1f;
  --tx2: #6e6e73;
  --tx3: #aeaeb2;
  --blue: #0071e3;
  --blue-light: #e8f0fd;
  --green: #28cd41;
  --green-light: #eaf7ec;
  --red: #ff3b30;
  --red-light: #fff0ef;
  --cell: 38px;
  --r: 10px;
}

html, body { height: 100dvh; background: var(--bg); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; overflow: hidden; }
@media (max-width: 700px) { html, body { overflow: auto; height: auto; } }
#app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
@media (max-width: 700px) { #app { height: auto; min-height: 100dvh; overflow: visible; } }

/* ── NAV ── */
.nav {
  height: 46px; flex-shrink: 0;
  background: rgba(245,245,247,0.88);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-title { font-size: .9rem; font-weight: 600; color: var(--tx); letter-spacing: -.01em; }
.nav-sub { font-size: .68rem; color: var(--tx3); }
.nav-badge {
  font-size: .62rem; font-weight: 600; letter-spacing: .04em;
  padding: 3px 9px; border-radius: 99px;
  background: var(--blue); color: #fff;
}

/* ── VIEWS ── */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
.view.active { display: flex; }
@media (max-width: 700px) { .view { overflow: visible; min-height: calc(100dvh - 46px); } }

/* ── SETUP – two-column desktop layout ── */
.setup-body {
  flex: 1; overflow: hidden; min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr auto;
  gap: 0;
}
@media (max-width: 700px) {
  .setup-body { display: flex; flex-direction: column; overflow: visible; padding-bottom: 16px; }
}

.setup-left  { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.setup-right { overflow-y: auto; display: flex; flex-direction: column; }
.setup-footer { grid-column: 1 / -1; border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: var(--surface); }

/* ── SECTION LABEL ── */
.sec-lbl { font-size: .62rem; font-weight: 600; color: var(--tx3); text-transform: uppercase; letter-spacing: .09em; margin-bottom: 5px; padding: 0 2px; }

.card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); overflow: hidden; }

/* ── MODE ── */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: var(--r); overflow: hidden; }
.mode-item {
  background: var(--surface); padding: 9px 10px;
  cursor: pointer; transition: background .1s;
  display: flex; align-items: center; gap: 7px;
  -webkit-user-select: none; user-select: none;
}
.mode-item:active { background: var(--bg); }
.mode-item.on { background: var(--blue-light); }
.mi-icon { font-size: .95rem; flex-shrink: 0; }
.mi-name { font-size: .78rem; font-weight: 600; color: var(--tx); }
.mi-desc { font-size: .64rem; color: var(--tx2); }
.mode-item.on .mi-name { color: var(--blue); }

/* ── FILTER ── */
.filter-wrap { padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 9px; border-radius: 99px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: .69rem; color: var(--tx2);
  cursor: pointer; transition: all .12s;
  -webkit-user-select: none; user-select: none;
}
.pill.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.pill-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

/* ── VOCAB LIST ── */
.vocab-row {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 6px 12px; border-bottom: 1px solid var(--border); gap: 8px;
}
.vocab-row:last-child { border-bottom: none; }
.vr-latin { font-size: .78rem; font-weight: 600; color: var(--tx); white-space: nowrap; }
.vr-de { font-size: .7rem; color: var(--tx2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vr-cat {
  font-size: .58rem; font-weight: 600; padding: 1px 6px; border-radius: 99px;
  background: var(--bg); color: var(--tx3); border: 1px solid var(--border);
  white-space: nowrap; flex-shrink: 0;
}

/* ── FOOTER / GENERATE ── */
.setup-footer { display: flex; align-items: center; gap: 10px; }
.btn-xs {
  padding: 3px 9px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: .68rem; font-weight: 600; color: var(--tx2);
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.btn-xs:active { background: var(--border); }
.btn-xs-blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.lb {
  aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--border);
  background: var(--bg); color: var(--tx3); font-size: .65rem; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none; transition: all .1s;
}
.lb:active { opacity: .7; }
.lb.sel { background: var(--blue); border-color: var(--blue); color: #fff; }
.footer-stat { font-size: .72rem; color: var(--tx2); white-space: nowrap; }
.footer-stat strong { color: var(--blue); }
.btn-gen {
  flex: 1; padding: 10px 16px; border-radius: var(--r); border: none;
  background: var(--blue); color: #fff;
  font-size: .88rem; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: opacity .15s;
  -webkit-user-select: none; user-select: none;
}
.btn-gen:active { opacity: .8; }
.btn-gen:disabled { background: var(--border); color: var(--tx3); cursor: not-allowed; }

/* ── PUZZLE ── */
.puzzle-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ── PUZZLE TOP ── */
.pz-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pz-info { font-size: .8rem; color: var(--tx2); }
.pz-acts { display: flex; gap: 6px; }
.btn-sm {
  padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: .76rem; font-weight: 600; color: var(--tx2);
  cursor: pointer; font-family: inherit; transition: all .12s;
}
.btn-sm:active { background: var(--bg); }
.btn-sm.primary { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ── PROGRESS ── */
.progress-bar { display: flex; align-items: center; gap: 10px; }
.progress-pct { font-size: 1.1rem; font-weight: 700; color: var(--tx); min-width: 36px; }
.progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue); border-radius: 99px; transition: width .3s ease; width: 0%; }
.progress-label { font-size: .7rem; color: var(--tx3); }

/* ── ACTIVE CLUE ── */
.active-clue {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 11px 14px;
  display: none; gap: 10px; align-items: flex-start;
  border-left: 3px solid var(--blue);
}
.active-clue.show { display: flex; }
.ac-num { font-size: .72rem; font-weight: 700; color: var(--blue); min-width: 20px; padding-top: 1px; }
.ac-clue { flex: 1; font-size: .82rem; color: var(--tx); line-height: 1.4; }
.ac-meta { font-size: .66rem; color: var(--tx3); margin-top: 2px; }
.ac-dir { font-size: .66rem; font-weight: 600; color: var(--blue); flex-shrink: 0; padding-top: 1px; }

/* ── GRID ── */
.grid-wrap { overflow: auto; -webkit-overflow-scrolling: touch; }
.cw-grid {
  display: inline-grid; gap: 2px; padding: 4px;
  background: var(--border); border-radius: var(--r);
}
.cell { width: var(--cell); height: var(--cell); position: relative; }
.cell.blk { background: var(--tx); border-radius: 3px; }
.cell.wht {
  background: var(--surface); border-radius: 3px;
  border: 1px solid var(--border); cursor: pointer;
}
.cell.hi { background: #dce8fb; border-color: #a8c5f5 !important; }
.cell.sel { background: #b8d4f8; border-color: var(--blue) !important; }
.cell.ok { background: var(--green-light) !important; border-color: #a0dba8 !important; }
.cell.ok input { color: #1a7f2a !important; }
.cell.ng { background: var(--red-light) !important; border-color: #ffb3af !important; }
.cell.ng input { color: var(--red) !important; }
.cell-num {
  position: absolute; top: 2px; left: 2px;
  font-size: .46rem; font-weight: 700; color: var(--tx2);
  line-height: 1; pointer-events: none; z-index: 1;
}
.cell input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  background: transparent; border: none; outline: none;
  text-align: center; font-size: .92rem; font-weight: 700; color: var(--tx);
  cursor: pointer; text-transform: uppercase; font-family: inherit;
  padding-top: 4px; -webkit-user-select: none; user-select: none;
  caret-color: transparent;
}

/* ── CLUES ── */
.clues-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .clues-grid { grid-template-columns: 1fr; } }
.clue-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.clue-panel-hd {
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  font-size: .68rem; font-weight: 600; color: var(--tx3);
  text-transform: uppercase; letter-spacing: .08em;
  display: flex; justify-content: space-between; align-items: center;
}
.clue-panel-hd span { color: var(--tx); font-size: .78rem; font-weight: 700; letter-spacing: 0; text-transform: none; }
.clue-list { display: flex; flex-direction: column; }
.ci {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; cursor: pointer; transition: background .1s;
  -webkit-user-select: none; user-select: none;
}
.ci:last-child { border-bottom: none; }
.ci:active { background: var(--bg); }
.ci.act { background: var(--blue-light); }
.ci.done { opacity: .3; }
.ci-num { font-size: .7rem; font-weight: 700; color: var(--blue); min-width: 18px; flex-shrink: 0; padding-top: 1px; }
.ci-body { flex: 1; min-width: 0; }
.ci-clue { font-size: .77rem; color: var(--tx); line-height: 1.3; }
.ci-meta { font-size: .62rem; color: var(--tx3); margin-top: 2px; }
.mode-tag { display: inline-block; font-size: .58rem; font-weight: 600; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
.mt-easy { background: #eaf7ec; color: #1a7f2a; }
.mt-gram { background: #f0eafd; color: #7a2fbf; }
.mt-conj { background: #fff0ef; color: var(--red); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: max(env(safe-area-inset-bottom, 0px), 20px);
  left: 50%; transform: translateX(-50%) translateY(16px);
  background: rgba(29,29,31,.9);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 99px; padding: 9px 20px;
  font-size: .78rem; color: #fff;
  opacity: 0; transition: all .25s; pointer-events: none; z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── HIDDEN INPUT ── */
.hidden-inp { position: fixed; opacity: 0; width: 1px; height: 1px; top: 50%; left: 50%; pointer-events: none; font-size: 16px; border: none; background: none; outline: none; }

/* ── LOADING ── */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 10px; padding: 40px; }
.loading-ring { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
.loading-txt { font-size: .84rem; color: var(--tx3); }
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>

<div id="app">
<div class="nav">
  <div>
    <div class="nav-title">Kreuzworträtsel · Kieler Wortschatz</div>
    <div class="nav-sub">Listen 1–50 · 1241 Vokabeln</div>
  </div>
  <div class="nav-badge" id="navBadge">Einfach</div>
</div>

<!-- SETUP -->
<div id="vSetup" class="view active">
  <div class="setup-body">

    <!-- LEFT: controls -->
    <div class="setup-left">
      <div>
        <div class="sec-lbl">Modus</div>
        <div class="mode-grid card">
          <div class="mode-item on" onclick="setMode('easy',this)">
            <div class="mi-icon">🟢</div><div><div class="mi-name">Einfach</div><div class="mi-desc">Deutsch → Latein</div></div>
          </div>
          <div class="mode-item" onclick="setMode('gram',this)">
            <div class="mi-icon">🟡</div><div><div class="mi-name">Grammatik</div><div class="mi-desc">Grammatikform → Latein</div></div>
          </div>
          <div class="mode-item" onclick="setMode('conj',this)">
            <div class="mi-icon">🔴</div><div><div class="mi-name">Formen</div><div class="mi-desc">Perf. · Gen. · Fem.</div></div>
          </div>
          <div class="mode-item" onclick="setMode('mix',this)">
            <div class="mi-icon">🎲</div><div><div class="mi-name">Mix</div><div class="mi-desc">Alles gemischt</div></div>
          </div>
        </div>
      </div>

      <div>
        <div class="sec-lbl">Wortarten</div>
        <div class="card">
          <div class="filter-wrap" id="catFilters"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: list selector + vocab preview -->
    <div class="setup-right">
      <div style="padding:8px 12px 6px;border-bottom:1px solid var(--border);flex-shrink:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:.62rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em">Listen</span>
          <div style="display:flex;gap:5px">
            <button class="btn-xs" onclick="selAll()">Alle</button>
            <button class="btn-xs" onclick="selNone()">Keine</button>
          </div>
        </div>
        <div style="display:flex;gap:5px;margin-bottom:6px">
          <input id="rangeIn" type="text" placeholder="z.B. 1,3,5-10" inputmode="text"
            style="flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:.72rem;font-family:inherit;color:var(--tx);outline:none">
          <button class="btn-xs btn-xs-blue" onclick="applyRange()">OK</button>
        </div>
        <div id="listGrid" style="display:grid;grid-template-columns:repeat(10,1fr);gap:3px"></div>
      </div>
      <div style="padding:5px 12px 4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <span style="font-size:.62rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em">Vokabeln</span>
        <span style="font-size:.68rem;color:var(--tx2)"><strong id="stF" style="color:var(--blue)">0</strong> geeignet</span>
      </div>
      <div id="vocabList" style="overflow-y:auto;flex:1"></div>
    </div>

    <!-- FOOTER -->
    <div class="setup-footer">
      <button class="btn-gen" id="btnGen" onclick="generate()" disabled>Rätsel generieren</button>
    </div>

  </div>
</div>

<!-- PUZZLE -->
<div id="vPuzzle" class="view">
  <div class="puzzle-scroll" id="pzScroll">
    <div class="loading"><div class="loading-ring"></div><div class="loading-txt">Wird erstellt…</div></div>
  </div>
</div>

</div>

<input class="hidden-inp" id="hiddenInp" type="text" maxlength="2"
  autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
<div class="toast" id="toast"></div>

var CATS = ['Verb','Substantiv','Adjektiv','Adverb','Konjunktion/Partikel','Pronomen','Sonstiges'];

var selCats = new Set(CATS);

var selLists = new Set();
for (var _i = 1; _i <= 50; _i++) selLists.add(_i); // all selected by default

function init() {

function buildListGrid() {

    var b = document.createElement('button'); b.className = 'lb sel'; b.textContent = i; b.setAttribute('data-n', i);

        if (selLists.has(n)) { selLists.delete(n); btn.classList.remove('sel'); }

      });
    })(i, b);

function selAll() {
  for (var i = 1; i <= 50; i++) { selLists.add(i); var b = document.querySelector('.lb[data-n="'+i+'"]'); if(b) b.classList.add('sel'); }
  buildVocabList(); updateStats();
}

function selNone() {
  selLists.clear();
  document.querySelectorAll('.lb').forEach(function(b) { b.classList.remove('sel'); });
  buildVocabList(); updateStats();
}

function applyRange() {
  var val = document.getElementById('rangeIn').value.trim(); if (!val) return;
  selNone();
  val.split(',').forEach(function(p) {
    p = p.trim();
    if (p.indexOf('-') > -1) {
      var pts = p.split('-'); var a = parseInt(pts[0]), b = parseInt(pts[1]);
      if (!isNaN(a) && !isNaN(b)) for (var i = Math.min(a,b); i <= Math.max(a,b) && i <= 50; i++) {
        selLists.add(i); var btn = document.querySelector('.lb[data-n="'+i+'"]'); if(btn) btn.classList.add('sel');
      }
    } else {
      var n = parseInt(p); if (!isNaN(n) && n >= 1 && n <= 50) {
        selLists.add(n); var btn = document.querySelector('.lb[data-n="'+n+'"]'); if(btn) btn.classList.add('sel');
      }
    }
  });
  buildVocabList(); updateStats();
}

function setMode(m, el) {
  mode = m;
  document.querySelectorAll('.mode-item').forEach(function(b) { b.classList.remove('on'); });
  el.classList.add('on');
  var names = { easy: 'Einfach', gram: 'Grammatik', conj: 'Formen', mix: 'Mix' };
  document.getElementById('navBadge').textContent = names[m] || m;

function buildCatFilters() {
  var c = document.getElementById('catFilters'); c.innerHTML = '';

    var el = document.createElement('div'); el.className = 'pill on';
    el.innerHTML = '<span class="pill-dot"></span>' + esc(cat);
    el.addEventListener('click', function() {
      if (selCats.has(cat)) { selCats.delete(cat); el.classList.remove('on'); }
      else { selCats.add(cat); el.classList.add('on'); }
      buildVocabList(); updateStats();
    });

  });
}

function buildVocabList() {
  var container = document.getElementById('vocabList'); container.innerHTML = '';
  var shown = 0;
  Array.from(selLists).sort(function(a,b){return a-b;}).forEach(function(n) {
    var ws = VOCAB[String(n)] || [];

    hdr.style.cssText = 'padding:4px 12px;background:var(--bg);border-bottom:1px solid var(--border);font-size:.6rem;font-weight:700;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;';

function updateStats() {
  var filtered = 0;
  selLists.forEach(function(n) {
    (VOCAB[String(n)] || []).forEach(function(w) {
      if (!selCats.has(w[2])) return;
      var q = makeQ(w, mode);
      if (q && q.word && q.word.length >= 2) filtered++;
    });
  });
  var el = document.getElementById('stF'); if(el) el.textContent = filtered;
  var btn = document.getElementById('btnGen');
  btn.disabled = filtered < 3;
  btn.textContent = filtered < 3 ? 'Zu wenig Vokabeln' : 'Rätsel generieren';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function normWord(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z]/g,'').toUpperCase(); }

// ── QUESTION BUILDER ─────────────────────────────────────
function makeQ(w, m) {
  var latin=w[0], german=w[1], cat=w[2], gram=w[3]||'';
  if (m==='easy') return qEasy(latin,german,cat);
  if (m==='gram') return qGram(latin,german,cat,gram) || qEasy(latin,german,cat);
  if (m==='conj') return qConj(latin,german,cat,gram) || qGram(latin,german,cat,gram) || qEasy(latin,german,cat);
  if (m==='mix') {
    var r = Math.random();
    var q = r < 0.35 ? qConj(latin,german,cat,gram) : r < 0.65 ? qGram(latin,german,cat,gram) : null;
    return q || qEasy(latin,german,cat);
  }
  return qEasy(latin,german,cat);
}

function qEasy(latin, german, cat) {
  var w = normWord(latin.split(/[\s,\/]/)[0]);
  if (!w || w.length < 2) return null;
  return { word: w, clue: german, cm: 'easy', cat: cat, latin: latin };
}

function qGram(latin, german, cat, gram) {
  var w = normWord(latin.split(/[\s,\/]/)[0]);
  if (!w || w.length < 2 || !gram || gram === '#NAME?') return null;
  var clue = '';
  if (cat === 'Verb') clue = gram + ' — ' + german;
  else if (cat === 'Substantiv') {
    var gm = gram.match(/\b([mfn])\b/);
    var gf = gm ? ({ m:'mask.', f:'fem.', n:'neutr.' }[gm[1]] || '') : '';
    clue = german + (gf ? ' (' + gf + ')' : '');
  }
  else if (cat === 'Adjektiv') clue = 'Adj. ' + gram + ' → mask. Nom.Sg.';
  else clue = gram + ' [' + cat + ']';
  return { word: w, clue: clue, cm: 'gram', cat: cat, latin: latin };
}

function qConj(latin, german, cat, gram) {
  var g = gram.trim();
  if (!g || g === '#NAME?') return null;
  var parts = g.split(',').map(function(p) { return p.trim(); });
  if (cat === 'Verb' && parts.length >= 3) {
    var choices = [];
    var perf = parts[1];
    if (perf && perf !== '---') { var pw = normWord(perf); if (pw && pw.length >= 2) choices.push({ word: pw, clue: 'Perf. 1.Sg. von „' + esc(latin) + '" — ' + esc(german), cm: 'conj', cat: cat, latin: latin }); }
    return choices.length ? choices[0] : null;
  }
  if (cat === 'Substantiv' && parts.length >= 1) {
    var gw = normWord(parts[0]);
    if (!gw || gw.length < 2) return null;
    return { word: gw, clue: 'Gen.Sg. von „' + esc(latin) + '" — ' + esc(german), cm: 'conj', cat: cat, latin: latin };
  }
  if (cat === 'Adjektiv' && parts.length >= 2) {
    var choices2 = [];
    var fn = normWord(parts[0]), nn = normWord(parts[1]);
    if (fn && fn.length >= 2) choices2.push({ word: fn, clue: 'Fem. Nom.Sg. von „' + esc(latin) + '" — ' + esc(german), cm: 'conj', cat: cat, latin: latin });
    if (nn && nn.length >= 2 && nn !== fn) choices2.push({ word: nn, clue: 'Neutr. Nom.Sg. von „' + esc(latin) + '" — ' + esc(german), cm: 'conj', cat: cat, latin: latin });
    return choices2.length ? choices2[Math.floor(Math.random() * choices2.length)] : null;
  }
  return null;
}

function getWords() {
  var out = [], seen = {};
  Array.from(selLists).sort(function(a,b){return a-b;}).forEach(function(n) {
    (VOCAB[String(n)] || []).forEach(function(w) {
      if (!selCats.has(w[2])) return;
      var q = makeQ(w, mode);
      if (q && q.word && q.word.length >= 2 && !seen[q.word]) { seen[q.word] = 1; out.push(q); }
    });
  });
  return shuffle(out);
}

function generate() {
  showPuzzle();
  document.getElementById('pzScroll').innerHTML = '<div class="loading"><div class="loading-ring"></div><div class="loading-txt">Wird erstellt…</div></div>';
  setTimeout(function() {
    var words = getWords().slice(0, 20);
    var result = buildPuzzle(words);
    if (!result || result.placed.length < 2) {
      document.getElementById('pzScroll').innerHTML = '<div class="loading" style="gap:8px"><span style="font-size:1.8rem">🔍</span><span style="font-size:.85rem;color:var(--tx2)">Zu wenige Wörter platzierbar.<br>Anderen Modus wählen.</span><button class="btn-sm" onclick="showSetup()" style="margin-top:4px">Zurück</button></div>';
      return;
    }

function shuffle(a) { for (var i=a.length-1;i>0;i--) { var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

// ── PUZZLE BUILDER ────────────────────────────────────────
var GS = 28;

function buildPuzzle(words) {
  var grid = [];
  for (var r = 0; r < GS; r++) { var row = []; for (var c = 0; c < GS; c++) row.push(null); grid.push(row); }
  var placed = [];

  function inB(r,c) { return r>=0&&r<GS&&c>=0&&c<GS; }

  function canPlace(word, r, c, dir) {
    var len = word.length;
    var dr = dir==='down'?1:0, dc = dir==='across'?1:0;
    var er = r+dr*(len-1), ec = c+dc*(len-1);
    if (!inB(r,c) || !inB(er,ec)) return false;
    if (inB(r-dr,c-dc) && grid[r-dr][c-dc] !== null) return false;
    if (inB(er+dr,ec+dc) && grid[er+dr][ec+dc] !== null) return false;
    var crosses = 0;
    for (var i = 0; i < len; i++) {
      var gr = r+dr*i, gc = c+dc*i;
      var cell = grid[gr][gc];
      if (cell !== null) {
        if (cell !== word[i]) return false;
        crosses++;
      } else {
        if (dir==='across') { if ((inB(gr-1,gc)&&grid[gr-1][gc]!==null)||(inB(gr+1,gc)&&grid[gr+1][gc]!==null)) return false; }
        else { if ((inB(gr,gc-1)&&grid[gr][gc-1]!==null)||(inB(gr,gc+1)&&grid[gr][gc+1]!==null)) return false; }
      }
    }
    return placed.length === 0 || crosses > 0;
  }

  function doPlace(word, r, c, dir) {
    var dr=dir==='down'?1:0, dc=dir==='across'?1:0;
    for (var i=0;i<word.length;i++) grid[r+dr*i][c+dc*i]=word[i];
  }

  function tryPlace(wobj) {
    var word = wobj.word;
    if (placed.length === 0) {
      var r = Math.floor(GS/2), c = Math.max(0, Math.floor(GS/2)-Math.floor(word.length/2));
      doPlace(word,r,c,'across');
      placed.push(Object.assign({},wobj,{row:r,col:c,dir:'across'})); return;
    }
    var cands = [];
    for (var pi=0;pi<placed.length;pi++) {
      var p = placed[pi];
      for (var ei=0;ei<p.word.length;ei++) {
        var letter = p.word[ei];
        for (var wi=0;wi<word.length;wi++) {
          if (word[wi] !== letter) continue;
          var td = p.dir==='across'?'down':'across';
          var tr = p.dir==='across' ? p.row-wi : p.row+ei;
          var tc = p.dir==='across' ? p.col+ei : p.col-wi;
          if (canPlace(word,tr,tc,td)) cands.push({r:tr,c:tc,dir:td,score:Math.random()});
        }
      }
    }
    if (!cands.length) return;
    cands.sort(function(a,b){return b.score-a.score;});
    var best = cands[0];
    doPlace(word,best.r,best.c,best.dir);
    placed.push(Object.assign({},wobj,{row:best.r,col:best.c,dir:best.dir}));
  }

  for (var i=0; i<words.length && placed.length<18; i++) tryPlace(words[i]);
  if (!placed.length) return null;

  // Safe trim
  var minR=GS,maxR=0,minC=GS,maxC=0;
  placed.forEach(function(p) {
    var er = p.row+(p.dir==='down'?p.word.length-1:0);
    var ec = p.col+(p.dir==='across'?p.word.length-1:0);
    minR=Math.min(minR,p.row); maxR=Math.max(maxR,er);
    minC=Math.min(minC,p.col); maxC=Math.max(maxC,ec);
  });
  var pad=1;
  var r0=Math.max(0,minR-pad), c0=Math.max(0,minC-pad);
  var r1=Math.min(GS-1,maxR+pad), c1=Math.min(GS-1,maxC+pad);
  var rows=r1-r0+1, cols=c1-c0+1;

  var tgrid = [];
  for (var r=0;r<rows;r++) {
    var row = [];
    for (var c=0;c<cols;c++) { var sr=r0+r,sc=c0+c; row.push(inB(sr,sc)?grid[sr][sc]:null); }
    tgrid.push(row);
  }

  var adj = placed.map(function(p) { return Object.assign({},p,{row:p.row-r0,col:p.col-c0}); });
  var numMap={}, num=1;
  for (var r=0;r<rows;r++) for (var c=0;c<cols;c++) {
    var rr=r, cc=c;
    var ha=adj.some(function(p){return p.dir==='across'&&p.row===rr&&p.col===cc;});
    var hd=adj.some(function(p){return p.dir==='down'&&p.row===rr&&p.col===cc;});
    if (ha||hd) numMap[r+','+c]=num++;
  }
  var np = adj.map(function(p){return Object.assign({},p,{number:numMap[p.row+','+p.col]});});
  return { grid:tgrid, placed:np, rows:rows, cols:cols, numMap:numMap };
}

var modeTagHTML = {
  easy: '<span class="mode-tag mt-easy">DE→LA</span>',

};

function renderPuzzle() {
  var P = puzzle;
  var across = P.placed.filter(function(p){return p.dir==='across';}).sort(function(a,b){return a.number-b.number;});
  var down   = P.placed.filter(function(p){return p.dir==='down';}).sort(function(a,b){return a.number-b.number;});
  var sc = document.getElementById('pzScroll'); sc.innerHTML = '';

  // Back + actions
  var top = el('div','pz-top');
  top.innerHTML = '<div class="pz-info">' + P.placed.length + ' Wörter</div>';
  var acts = el('div','pz-acts');
  acts.innerHTML = '<button class="btn-sm" onclick="showSetup()">← Zurück</button><button class="btn-sm" onclick="checkAll()">Prüfen</button><button class="btn-sm" onclick="revealAll()">Lösung</button><button class="btn-sm" onclick="resetAll()">Reset</button><button class="btn-sm primary" onclick="generate()">↻ Neu</button>';
  top.appendChild(acts); sc.appendChild(top);

  // Progress
  var pb = el('div','progress-bar');
  pb.innerHTML = '<div class="progress-pct" id="pct">–</div><div style="flex:1"><div class="progress-track"><div class="progress-fill" id="pFill"></div></div><div class="progress-label" id="pLbl">0 / '+P.placed.length+' ausgefüllt</div></div>';
  sc.appendChild(pb);

  // Active clue bar
  var acb = el('div','active-clue'); acb.id='acBar';
  acb.innerHTML = '<div class="ac-num" id="acNum"></div><div><div class="ac-clue" id="acClue"></div><div class="ac-meta" id="acMeta"></div></div><div class="ac-dir" id="acDir"></div>';
  sc.appendChild(acb);

  // Grid
  var gw = el('div','grid-wrap');
  var cg = el('div','cw-grid'); cg.id='cwGrid';
  cg.style.gridTemplateColumns = 'repeat('+P.cols+',var(--cell))';
  cg.style.gridTemplateRows    = 'repeat('+P.rows+',var(--cell))';
  for (var r=0;r<P.rows;r++) for (var c=0;c<P.cols;c++) {
    var cell = el('div','cell '+(P.grid[r][c]!==null?'wht':'blk'));
    cell.setAttribute('data-r',r); cell.setAttribute('data-c',c);
    if (P.grid[r][c]!==null) {
      var key=r+','+c;
      if (P.numMap[key]) { var ns=el('span','cell-num'); ns.textContent=P.numMap[key]; cell.appendChild(ns); }
      var inp=el('input'); inp.type='text'; inp.maxLength=1; inp.setAttribute('data-ans',P.grid[r][c]);
      inp.readOnly=true; inp.autocomplete='off'; inp.spellcheck=false;
      cell.appendChild(inp);
      (function(row,col){ cell.addEventListener('touchstart',function(e){e.preventDefault();tap(row,col);},{passive:false}); cell.addEventListener('mousedown',function(e){e.preventDefault();tap(row,col);}); })(r,c);
    }
    cg.appendChild(cell);
  }
  gw.appendChild(cg); sc.appendChild(gw);

  // Clues
  var cg2 = el('div','clues-grid');
  cg2.appendChild(makePanel('→ Waagrecht', across, 'across'));
  cg2.appendChild(makePanel('↓ Senkrecht', down, 'down'));
  sc.appendChild(cg2);
}

function makePanel(title, items, dir) {
  var panel = el('div','clue-panel');
  var hd = el('div','clue-panel-hd');
  hd.innerHTML = title + ' <span>' + items.length + '</span>';
  panel.appendChild(hd);
  var list = el('div','clue-list');
  items.forEach(function(p) {
    var ci = el('div','ci'); ci.id='ci-'+dir+'-'+p.number;
    var tag = modeTagHTML[p.cm]||'';
    ci.innerHTML = '<div class="ci-num">'+p.number+'</div><div class="ci-body"><div class="ci-clue">'+tag+esc(p.clue)+'</div><div class="ci-meta">'+p.word.length+' Buchst. · '+esc(p.cat)+'</div></div>';
    (function(num,d){ci.addEventListener('click',function(){focusWord(num,d);});})(p.number,dir);
    list.appendChild(ci);
  });
  panel.appendChild(list); return panel;
}

function el(tag, cls) { var e=document.createElement(tag||'div'); if(cls)e.className=cls; return e; }

// ── INPUT ─────────────────────────────────────────────────
function getCell(r,c) { return document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]'); }

function tap(r,c) {
  var cur = puzzle&&puzzle.placed.find(function(p){return p.number===activeNum&&p.dir===activeDir;});
  if (cur) {
    var inW = activeDir==='across' ? r===cur.row&&c>=cur.col&&c<cur.col+cur.word.length : c===cur.col&&r>=cur.row&&r<cur.row+cur.word.length;
    if (inW) {
      var od = activeDir==='across'?'down':'across';
      var ow = puzzle.placed.find(function(p) {
        if(p.dir!==od)return false;
        return od==='across'?p.row===r&&p.col<=c&&c<p.col+p.word.length:p.col===c&&p.row<=r&&r<p.row+p.word.length;
      });
      if (ow) { activeDir=od; activeNum=ow.number; highlight(); updateBar(); focusH(r,c); return; }
    }
  }
  var aw=puzzle.placed.find(function(p){return p.dir==='across'&&p.row===r&&p.col<=c&&c<p.col+p.word.length;});
  var dw=puzzle.placed.find(function(p){return p.dir==='down'&&p.col===c&&p.row<=r&&r<p.row+p.word.length;});
  if(aw){activeNum=aw.number;activeDir='across';}else if(dw){activeNum=dw.number;activeDir='down';}
  highlight(); updateBar(); focusH(r,c);
}

function focusH(r,c) {
  var hi=document.getElementById('hiddenInp'); hi.value=''; hi.setAttribute('data-r',r); hi.setAttribute('data-c',c); hi.focus();
}

function onHiddenInput(e) {
  var hi=document.getElementById('hiddenInp');
  var val=hi.value.replace(/[^a-zA-Z]/g,'').toUpperCase(); hi.value='';
  var r=parseInt(hi.getAttribute('data-r')), c=parseInt(hi.getAttribute('data-c'));
  if(isNaN(r)||isNaN(c)||!val)return;
  var cell=getCell(r,c); if(!cell||!cell.classList.contains('wht'))return;
  cell.querySelector('input').value=val[val.length-1];
  cell.classList.remove('ok','ng');
  advFrom(r,c); updateProgress();
}

function onHiddenKey(e) {
  var hi=document.getElementById('hiddenInp');
  var r=parseInt(hi.getAttribute('data-r')), c=parseInt(hi.getAttribute('data-c'));
  if(isNaN(r)||isNaN(c))return;
  if(e.key==='Backspace'){
    e.preventDefault();
    var cell=getCell(r,c); if(!cell)return;
    var inp=cell.querySelector('input');
    if(inp&&inp.value){inp.value='';cell.classList.remove('ok','ng');updateProgress();}else{moveFrom(r,c,-1);}
  } else if(e.key==='ArrowRight'){e.preventDefault();moveFrom(r,c,1,'across');}
    else if(e.key==='ArrowLeft'){e.preventDefault();moveFrom(r,c,-1,'across');}
    else if(e.key==='ArrowDown'){e.preventDefault();moveFrom(r,c,1,'down');}
    else if(e.key==='ArrowUp'){e.preventDefault();moveFrom(r,c,-1,'down');}
}

function advFrom(r,c) {
  var dr=activeDir==='down'?1:0, dc=activeDir==='across'?1:0;
  var nx=getCell(r+dr,c+dc);
  if(nx&&nx.classList.contains('wht')){tap(r+dr,c+dc);focusH(r+dr,c+dc);}
}
function moveFrom(r,c,d,fd) {
  var dir=fd||activeDir;
  var dr=dir==='down'?d:0, dc=dir==='across'?d:0;
  var nx=getCell(r+dr,c+dc);
  if(nx&&nx.classList.contains('wht')){tap(r+dr,c+dc);focusH(r+dr,c+dc);}
}
function focusWord(num,dir) {
  activeNum=num;activeDir=dir;highlight();updateBar();
  var w=puzzle.placed.find(function(p){return p.number===num&&p.dir===dir;});
  if(w)focusH(w.row,w.col);
}

function highlight() {
  document.querySelectorAll('.cell.hi,.cell.sel').forEach(function(c){c.classList.remove('hi','sel');});
  document.querySelectorAll('.ci.act').forEach(function(c){c.classList.remove('act');});
  if(!activeNum||!puzzle)return;
  var w=puzzle.placed.find(function(p){return p.number===activeNum&&p.dir===activeDir;});
  if(!w)return;
  var dr=w.dir==='down'?1:0,dc=w.dir==='across'?1:0;
  for(var i=0;i<w.word.length;i++)getCell(w.row+dr*i,w.col+dc*i).classList.add('hi');
  getCell(w.row,w.col).classList.add('sel');
  var ci=document.getElementById('ci-'+w.dir+'-'+w.number);
  if(ci){ci.classList.add('act');ci.scrollIntoView({block:'nearest',behavior:'smooth'});}
}

function updateBar() {
  if(!puzzle)return;
  var bar=document.getElementById('acBar'); if(!bar)return;
  var w=puzzle.placed.find(function(p){return p.number===activeNum&&p.dir===activeDir;});
  if(!w){bar.classList.remove('show');return;}
  bar.classList.add('show');
  document.getElementById('acNum').textContent=w.number;
  document.getElementById('acClue').textContent=w.clue;
  document.getElementById('acMeta').textContent=w.word.length+' Buchstaben · '+w.cat;
  document.getElementById('acDir').textContent=activeDir==='across'?'→ Waagrecht':'↓ Senkrecht';
}

// ── CHECK / REVEAL / RESET ────────────────────────────────
function checkAll() {
  if(!puzzle)return;
  var correct=0;
  puzzle.placed.forEach(function(w){
    var dr=w.dir==='down'?1:0,dc=w.dir==='across'?1:0,ok=true;
    for(var i=0;i<w.word.length;i++){
      var cell=getCell(w.row+dr*i,w.col+dc*i);
      var inp=cell&&cell.querySelector('input'); var v=inp?inp.value.toUpperCase():'';
      if(!v)ok=false;
      else if(v===w.word[i]){cell.classList.remove('ng');cell.classList.add('ok');}
      else{cell.classList.remove('ok');cell.classList.add('ng');ok=false;}
    }
    if(ok){correct++;var ci=document.getElementById('ci-'+w.dir+'-'+w.number);if(ci)ci.classList.add('done');}
  });
  toast(correct+' / '+puzzle.placed.length+' korrekt ('+Math.round(correct/puzzle.placed.length*100)+'%)');
  updateProgress();
}

function revealAll() {
  if(!puzzle)return;
  puzzle.placed.forEach(function(w){
    var dr=w.dir==='down'?1:0,dc=w.dir==='across'?1:0;
    for(var i=0;i<w.word.length;i++){
      var cell=getCell(w.row+dr*i,w.col+dc*i);if(!cell)continue;
      cell.querySelector('input').value=w.word[i];
      cell.classList.add('ok');cell.classList.remove('ng');
    }
    var ci=document.getElementById('ci-'+w.dir+'-'+w.number);if(ci)ci.classList.add('done');
  });
  document.getElementById('pFill').style.width='100%';
  document.getElementById('pLbl').textContent=puzzle.placed.length+' / '+puzzle.placed.length+' ausgefüllt';
  document.getElementById('pct').textContent='100%';
  toast('Lösung angezeigt');
}

function resetAll() {
  if(!puzzle)return;
  document.querySelectorAll('.cell.wht input').forEach(function(i){i.value='';});
  document.querySelectorAll('.cell').forEach(function(c){c.classList.remove('ok','ng');});
  document.querySelectorAll('.ci').forEach(function(c){c.classList.remove('done');});
  document.getElementById('pFill').style.width='0%';
  document.getElementById('pLbl').textContent='0 / '+puzzle.placed.length+' ausgefüllt';
  document.getElementById('pct').textContent='–';
  toast('Zurückgesetzt');
}

function updateProgress() {
  if(!puzzle)return;
  var filled=0,correct=0;
  puzzle.placed.forEach(function(w){
    var dr=w.dir==='down'?1:0,dc=w.dir==='across'?1:0,wf=true,wc=true;
    for(var i=0;i<w.word.length;i++){
      var cell=getCell(w.row+dr*i,w.col+dc*i);
      var inp=cell&&cell.querySelector('input');
      if(!inp||!inp.value){wf=false;wc=false;break;}
      if(inp.value.toUpperCase()!==w.word[i])wc=false;
    }
    if(wf)filled++;if(wc)correct++;
  });
  var pct=Math.round(filled/puzzle.placed.length*100);
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pLbl').textContent=filled+' / '+puzzle.placed.length+' ausgefüllt';
  document.getElementById('pct').textContent=correct?Math.round(correct/puzzle.placed.length*100)+'%':'–';
}

function toast(msg) {
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2600);
}

init();
</script>
